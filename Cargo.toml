[package]
name = "reoclo-desktop"
version = "0.4.2"
edition = "2024"
license = "MIT"
description = "Reoclo for macOS: your Reoclo tunnels and local HTTPS in the menu bar"
repository = "https://github.com/reoclo/desktop"
homepage = "https://reoclo.com"
publish = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tray-icon = "0.21"

[dev-dependencies]
tempfile = "3"

# Rune's own [patch.crates-io] table at the pinned rev. Cargo does not inherit patches from a
# dependency, so every app that builds Rune repeats them at the same rev.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }

[profile.dev]
debug = 0

[profile.release]
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[[example]]
name = "hello"
path = "examples/hello.rs"
