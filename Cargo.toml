[package]
name = "reoclo-desktop"
version = "0.4.1"
edition = "2024"
license = "MIT"
description = "Reoclo tunnel daemon desktop client"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "938ba14f09bb3381946b3486ef8aa36363a3e8b2" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "938ba14f09bb3381946b3486ef8aa36363a3e8b2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tray-icon = "0.21"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[[example]]
name = "hello"
path = "examples/hello.rs"
